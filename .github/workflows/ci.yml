name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every main commit finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      content: ${{ steps.filter.outputs.content }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'api/**'
              - '.github/workflows/ci.yml'
            backend:
              - *shared
              - 'backend/**'
              - 'content/**'
            frontend:
              - *shared
              - 'frontend/**'
            content:
              - 'content/**'
              - 'scripts/graph_check.py'
              - '.github/workflows/ci.yml'
            e2e:
              - *shared
              - 'backend/**'
              - 'frontend/**'
              - 'e2e/**'
              - 'content/**'
              - 'docker-compose*.yml'
            docker:
              - '.github/workflows/ci.yml'
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose*.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tutor:tutor@localhost:5432/tutor_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Codegen drift check
        run: |
          make generate
          if ! git diff --exit-code || [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated code is stale. Run 'make generate' and commit the result."
            exit 1
          fi

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API types drift check
        run: |
          pnpm run gen:api
          if ! git diff --exit-code || [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated API types are stale. Run 'pnpm run gen:api' and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Audit (non-blocking)
        continue-on-error: true
        run: pnpm audit --prod

  content:
    name: Content graph
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate graphs and check rendered markdown is current
        run: |
          for yaml in content/*/graph.yaml; do
            dir="$(dirname "$yaml")"
            echo "::group::$dir"
            python scripts/graph_check.py "$yaml" "$dir/graph.md"
            echo "::endgroup::"
          done
          if ! git diff --exit-code -- content; then
            echo "::error::content/*/graph.md is out of date. Run 'make graph-check' and commit."
            exit 1
          fi

  docker:
    name: Docker image (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: tutor-platform/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_MCP_URL: http://localhost:8080/mcp
      E2E_MCP_TOKEN: e2e-mcp-token
      DATABASE_URL: postgres://tutor:tutor@localhost:5433/tutor?sslmode=disable
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: docker/setup-buildx-action@v4

      - name: Start stack
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES up -d --build --wait --wait-timeout 300

      - name: Seed course graph
        run: make seed

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install e2e deps
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: pnpm test

      - name: Dump compose logs
        if: failure()
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES logs --no-color > compose-logs.txt

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            compose-logs.txt
          retention-days: 14

      - name: Stop stack
        if: always()
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES down -v

  # Single required status check for branch protection. Skipped jobs (no relevant
  # changes) count as success; failed or cancelled jobs fail this one.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, backend, frontend, content, docker, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
