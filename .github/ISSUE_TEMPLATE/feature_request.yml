name: Feature request
description: Propose a new capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which Learner / Owner / Content Admin problem does this solve? Use CONTEXT.md vocabulary.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen? Include API or UI sketches if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Likely impact
      options:
        - label: Changes domain language (CONTEXT.md)
        - label: Needs an ADR
        - label: Changes the REST contract (api/openapi.yaml)
        - label: Changes MCP tools
